# Rebuilds the project website when a file it shows changes here. The site reads ROADMAP.md,
# CHANGELOG.md and docs/ at build time (scripts/fetch-docs.mjs in the website's repository);
# keep the paths below in step with that script. The Actions secret WEBSITE_DEPLOY_HOOK holds
# the URL of the website's Vercel deploy hook. See docs/publishing.md#the-website.
name: Notify website

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - ROADMAP.md
      - CHANGELOG.md
  workflow_dispatch:

permissions: {}

jobs:
  rebuild:
    if: github.repository == 'hesamsheikh/CrusaderArena'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Call the deploy hook
        env:
          HOOK: ${{ secrets.WEBSITE_DEPLOY_HOOK }}
        run: |
          # A pasted secret can carry a newline or spaces, which curl rejects.
          HOOK=$(printf '%s' "$HOOK" | tr -d '[:space:]')
          echo "::add-mask::$HOOK"
          if [ -z "$HOOK" ]; then
            echo "::error::The WEBSITE_DEPLOY_HOOK secret is not set."
            exit 1
          fi
          case "$HOOK" in
            https://*) ;;
            *) echo "::error::WEBSITE_DEPLOY_HOOK is not an https:// URL; set it again."; exit 1 ;;
          esac
          curl -fsS --retry 3 --max-time 30 -X POST "$HOOK" -o /dev/null
          echo "The website is rebuilding."
